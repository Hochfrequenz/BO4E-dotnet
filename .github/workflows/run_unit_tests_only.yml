name: Unittests

on: [push, pull_request]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Run Tests
        run: dotnet test --configuration Release
